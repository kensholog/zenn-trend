name: trend-feed

# 公式トレンド RSS（zenn.dev/feed）と新着 48 本を毎時保存する。1 回 約 22 リクエスト、1 req/s。
# 注意: GitHub の cron は負荷時に遅延・スキップされることがある。無活動 60 日で schedule が自動停止する規則があるので、
# 月に 1 回は Actions の画面で動いているかを確認する（自動コミットが活動に数えられるかは未確認）。
# 実測 2026-09-04: 毎時 7 分の設定で、最初の 5 時間に走ったのは 1 回だけ（09:33Z、26 分遅れ）。
# 取りこぼしを減らすため 30 分ごとに起動する（1 回 約 22 リクエスト、1 日 約 1,000 リクエスト、1 req/s）。
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trend-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        run: python scripts/fetch_trend_feed.py
      - name: Own metrics (3 requests; public numbers of the account's own articles)
        run: python scripts/fetch_own_metrics.py kensholog || echo "own metrics failed (non-fatal)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trend_feed latest_feed own_metrics
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: trend feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
